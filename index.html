<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sakura ChemLab 3D Online ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        html, body { width: 100vw; height: 100vh; margin: 0; padding: 0; overflow: hidden; background: #230d21; font-family: 'Nunito', sans-serif; user-select: none; }
        #three-container { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
        .glass-pink { background: rgba(255, 245, 249, 0.95); backdrop-filter: blur(18px); border: 2px solid rgba(251, 113, 150, 0.45); box-shadow: 0 14px 36px -6px rgba(225, 29, 88, 0.25); }
        .glossy-btn { background: linear-gradient(180deg, #ff7aa2 0%, #f43f72 100%); box-shadow: 0 6px 18px -3px rgba(244, 63, 114, 0.55); transition: transform 0.16s ease; }
        .glossy-btn:hover { transform: translateY(-1.5px) scale(1.02); }
        .glossy-btn:active { transform: scale(0.96); }
    </style>
</head>
<body class="text-sakura-950">

    <div id="three-container"></div>

    <!-- LOBBY OVERLAY -->
    <div id="lobby-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gradient-to-br from-sakura-950/90 via-purple-950/90 to-pink-950/90 backdrop-blur-md">
        <div class="glass-pink w-full max-w-md rounded-3xl p-6 sm:p-7 border-2 border-white shadow-2xl">
            <div class="flex items-center gap-3.5 mb-5">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-b from-pink-200 to-purple-200 border-2 border-white shadow flex items-center justify-center text-2xl">🌸</div>
                <div>
                    <span class="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full bg-pink-500 text-white tracking-wider">3D ChemLab Online</span>
                    <h1 class="text-xl font-black text-pink-800 mt-1">Sakura ChemLab 3D ✨</h1>
                    <p class="text-xs font-bold text-pink-700/80">Зертханаға қош келдіңіз!</p>
                </div>
            </div>

            <div class="flex flex-col gap-3.5">
                <div>
                    <label class="block text-xs font-extrabold text-pink-800 mb-1">Химик есіміңіз:</label>
                    <input type="text" id="lobby-name" value="Айс тян" placeholder="Атыңыз..." maxlength="18"
                        class="w-full bg-white border-2 border-pink-300 focus:border-pink-500 rounded-2xl px-3.5 py-2.5 text-sm font-extrabold text-gray-900 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-extrabold text-pink-800 mb-1">Бөлме коды:</label>
                    <input type="text" id="lobby-room" value="SAKURA-101" placeholder="SAKURA-101" maxlength="16"
                        class="w-full bg-white border-2 border-purple-300 focus:border-purple-500 rounded-2xl px-3.5 py-2.5 text-sm font-mono font-extrabold text-purple-900 uppercase outline-none">
                </div>

                <button onclick="enterLabWorld()" class="glossy-btn w-full py-3.5 rounded-2xl text-white font-black text-base flex items-center justify-center gap-2 mt-2 border-2 border-white cursor-pointer">
                    <span>🚀 Зертханаға кіру</span>
                </button>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud-layer" class="hidden fixed inset-0 z-20 pointer-events-none flex flex-col justify-between p-4">
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="glass-pink px-4 py-2.5 rounded-2xl flex items-center gap-3 shadow-lg">
                <div id="hud-avatar-dot" class="w-9 h-9 rounded-full bg-pink-500 text-white font-black flex items-center justify-center text-sm shadow">А</div>
                <div>
                    <div id="hud-player-name" class="font-black text-xs text-pink-900">Айс тян</div>
                    <div class="text-[10px] font-bold text-pink-600">Бөлме: <span id="hud-room-code">SAKURA-101</span></div>
                </div>
            </div>
            <div class="glass-pink px-4 py-2 rounded-2xl flex items-center gap-3 shadow-lg text-xs font-black text-pink-800">
                <span>🟢 Статус: <span class="text-emerald-600 font-mono">Белсенді</span></span>
            </div>
        </div>

        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full border-2 border-white/80 bg-white/20 pointer-events-none"></div>

        <div class="flex justify-between items-end pointer-events-auto">
            <div class="glass-pink w-80 max-h-40 rounded-2xl p-3 flex flex-col gap-1.5 shadow-lg">
                <div class="text-[10px] font-black text-pink-800 uppercase tracking-wider">💬 Чат лентасы</div>
                <div id="chat-feed" class="h-24 overflow-y-auto text-[11px] font-bold flex flex-col gap-1 pr-1">
                    <div class="text-pink-700 bg-pink-100/60 p-1 rounded">🌸 Зертханаға қош келдіңіз!</div>
                </div>
                <div class="flex gap-1.5 mt-1">
                    <input type="text" id="chat-input" placeholder="Хабарлама..." class="flex-1 bg-white border border-pink-300 rounded-xl px-2.5 py-1 text-xs font-bold text-gray-900 outline-none">
                    <button onclick="sendChatMessage()" class="glossy-btn px-3 py-1 rounded-xl text-white text-xs font-black cursor-pointer">Жіберу</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const state = { playerName: 'Айс тян', roomCode: 'SAKURA-101', inWorld: false };

        window.enterLabWorld = function () {
            const nameInput = document.getElementById('lobby-name').value.trim();
            const roomInput = document.getElementById('lobby-room').value.trim();

            if (nameInput) state.playerName = nameInput;
            if (roomInput) state.roomCode = roomInput.toUpperCase();

            document.getElementById('hud-player-name').textContent = state.playerName;
            document.getElementById('hud-avatar-dot').textContent = state.playerName[0].toUpperCase();
            document.getElementById('hud-room-code').textContent = state.roomCode;

            // Лоббиді жасырып, ойынды ашу
            document.getElementById('lobby-overlay.style.display')... // safety
            document.getElementById('lobby-overlay').style.display = 'none';
            document.getElementById('hud-layer').classList.remove('hidden');
            state.inWorld = true;

            appendFeed('Жүйе', `${state.playerName} зертханаға қосылды!`, true);
        };

        function appendFeed(sender, text, isSystem = false) {
            const feed = document.getElementById('chat-feed');
            const row = document.createElement('div');
            if (isSystem) {
                row.className = 'text-purple-800 font-bold bg-pink-100 px-2 py-0.5 rounded';
                row.textContent = text;
            } else {
                row.innerHTML = `<strong class="text-pink-600">${sender}:</strong> <span class="text-gray-900">${text}</span>`;
            }
            feed.appendChild(row);
            feed.scrollTop = feed.scrollHeight;
        }

        window.sendChatMessage = function () {
            const inp = document.getElementById('chat-input');
            const txt = inp.value.trim();
            if (!txt) return;
            inp.value = '';
            appendFeed(state.playerName, txt, false);
        };

        // Three.js 3D Lab
        const container = document.getElementById('three-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfce7f3);
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.68, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.DirectionalLight(0xffffff, 1).position.set(5, 10, 5));
        scene.add(new THREE.AmbientLight(0xfff5f8, 0.8));

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), new THREE.MeshStandardMaterial({ color: 0xfccde2 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        let yaw = 0, pitch = 0;
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if ((e.code === 'Enter' || e.code === 'KeyT') && state.inWorld) {
                document.getElementById('chat-input').focus();
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function animate() {
            requestAnimationFrame(animate);
            if (state.inWorld) {
                camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                const speed = 0.04;
                const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
                const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
                if (keys['KeyW']) camera.position.addScaledVector(fwd, speed);
                if (keys['KeyS']) camera.position.addScaledVector(fwd, -speed);
                if (keys['KeyD']) camera.position.addScaledVector(right, speed);
                if (keys['KeyA']) camera.position.addScaledVector(right, -speed);
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
